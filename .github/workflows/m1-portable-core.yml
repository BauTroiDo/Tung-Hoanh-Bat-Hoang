name: M1 portable-core AOI gates

on:
  push:
    paths:
      - 'portable_core/**'
      - '.github/workflows/m1-portable-core.yml'
  pull_request:
    paths:
      - 'portable_core/**'
      - '.github/workflows/m1-portable-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-core-ctest:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated portable core
        run: cmake -S portable_core -B build-m1 -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DBUILD_TESTING=ON
      - name: Build with warnings treated as errors
        run: |
          cmake --build build-m1 -j 2 --verbose
      - name: Run all portable-core CTests
        run: ctest --test-dir build-m1 --output-on-failure --timeout 30
